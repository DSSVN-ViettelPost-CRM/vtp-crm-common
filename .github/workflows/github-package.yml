name: Publish package to GitHub Packages
on:
  push:
    branches:
      - develop
      - staging
      - dss-prd
      - dss-stg

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Publish package develop
        if: github.ref == 'refs/heads/develop'
        run: mvn clean deploy --batch-mode && mvn clean deploy --batch-mode -Pdevelop
        env:
          GITHUB_ACTOR: ${{ vars.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish package staging
        if: github.ref == 'refs/heads/staging'
        run: mvn clean deploy --batch-mode -Pstaging
        env:
          GITHUB_ACTOR: ${{ vars.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish package dss prd
        if: github.ref == 'refs/heads/dss-prd'
        run: mvn clean deploy --batch-mode -Pdss-prd
        env:
          GITHUB_ACTOR: ${{ vars.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish package dss-stg
        if: github.ref == 'refs/heads/dss-stg'
        run: mvn clean deploy --batch-mode -Pdss-stg
        env:
          GITHUB_ACTOR: ${{ vars.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

